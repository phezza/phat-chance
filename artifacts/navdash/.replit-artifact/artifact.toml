kind = "web"
previewPath = "/"
title = "NavDash - Marine Navigation Dashboard"
version = "1.0.0"
id = "artifacts/navdash"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22759

[services.development]
run = "pnpm --filter @workspace/navdash run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/navdash", "run", "build" ]
publicDir = "artifacts/navdash/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22759"
BASE_PATH = "/"
